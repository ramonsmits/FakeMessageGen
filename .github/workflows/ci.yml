name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Skip the duplicate pull_request run for branches in this repository, the push run already covers them
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # MinVer needs the tag history
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build FakeMessageGen/FakeMessageGen.csproj --configuration Release
      - name: Smoke test
        # Without arguments the tool prints its usage and exits
        run: dotnet FakeMessageGen/bin/Release/net10.0/FakeMessageGen.dll
      - name: Pack
        if: matrix.os == 'ubuntu-latest'
        run: dotnet pack FakeMessageGen/FakeMessageGen.csproj --configuration Release --no-build
      - name: Upload package
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: FakeMessageGen/nupkg/*.nupkg
