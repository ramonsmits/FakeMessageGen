name: Release

# Pushing a version tag (YYYY.RELEASECOUNT.PATCH, see README) builds the package,
# pushes it to nuget.org and creates the GitHub release with the changelog section.
#
# Publishing uses nuget.org Trusted Publishing: the job's GitHub OIDC token is exchanged for a
# short-lived API key, so no long-lived NuGet API key is stored. This requires a Trusted Publishing
# policy on nuget.org for this repository and workflow file (release.yml), and the NUGET_USER secret
# holding the nuget.org profile name that owns the package.
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write # create the GitHub release
  id-token: write # request the OIDC token for nuget.org Trusted Publishing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # MinVer derives the version from the tag
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Pack
        run: dotnet pack FakeMessageGen/FakeMessageGen.csproj --configuration Release
      - name: Verify package version matches tag
        run: |
          expected="FakeMessageGen/nupkg/NBraceIT.FakeMessageGen.${GITHUB_REF_NAME}.nupkg"
          if [ ! -f "$expected" ]; then
            echo "Expected $expected, found:"; ls FakeMessageGen/nupkg
            exit 1
          fi
      - name: Extract changelog section
        run: |
          awk -v v="$GITHUB_REF_NAME" '
            /^## \[/ { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } }
            found { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No changelog section for $GITHUB_REF_NAME found in CHANGELOG.md"
            exit 1
          fi
          cat release-notes.md
      - name: NuGet login (Trusted Publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push to nuget.org
        # The temporary key is valid for one hour, so this runs right after login
        run: dotnet nuget push "FakeMessageGen/nupkg/NBraceIT.FakeMessageGen.${GITHUB_REF_NAME}.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --verify-tag --notes-file release-notes.md "FakeMessageGen/nupkg/NBraceIT.FakeMessageGen.${GITHUB_REF_NAME}.nupkg"
